[project]
name = "research-rag"
version = "1.0.0"
description = "A RAG chatbot over ML papers, written to be read"
requires-python = ">=3.12"
dependencies = [
    "pypdfium2",
    "sentence-transformers",
    "faiss-cpu",
    "openai",
    "fastapi",
    "uvicorn",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
