# Runtime config for the live endpoint. Provider: OpenAI flagship per request.
generate:
  provider: openai
  model: gpt-5.6-sol
  effort: high
retrieve:
  strategy: hybrid
  rerank: false   # skip the 1.1GB cross-encoder download for first serve; flip on later
eval:
  judge_provider: openai
  judge_model: gpt-5.6-sol
ocr:
  engine: pypdfium
