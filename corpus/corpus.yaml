# The corpus: research papers from the InterviewReady AI-engineering library.
#
# PDFs are never committed. `rag ingest` downloads each url, verifies it against
# sha256 when pinned, and pins the digest on first fetch. To add a paper: add an
# entry, run `rag ingest`, review the pinned digest in the diff.
#
# "Attention Is All You Need" is deliberately absent: it is the demo document in
# the teaching notebooks, and this corpus exists to be the follow-up, not a rerun.
#
# Licences: arXiv papers are distributed under the licence shown on each paper's
# abs page (arXiv non-exclusive licence or a CC variant). This project downloads
# them at ingest time for local research use and redistributes nothing.

version: 1
source_repo: https://github.com/InterviewReady/ai-engineering-resources

