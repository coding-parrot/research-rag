# Hand-labelled section structure, the ground truth for `rag headers`.
#
# This is the highest-value labelling work in the project: with one chunking
# strategy, header detection *is* chunk quality, and this file is what catches a
# Surya upgrade or a config change silently degrading it.
#
# How to label a paper: open the PDF, write down the top-level section labels
# exactly as printed (number + title). Ten papers is enough to make the metric
# meaningful. Verify against the PDF, not from memory.
#
# The two entries below were seeded from the papers' well-known structure and
# must be verified against the actual PDFs before the metric is trusted; that is
# what `verified: false` in the notes means.

documents:
  - doc_id: bert
    notes: "seeded, verify against the PDF before trusting the score"
    sections:
      - "1 Introduction"
      - "2 Related Work"
      - "3 BERT"
      - "4 Experiments"
      - "5 Ablation Studies"
      - "6 Conclusion"

  - doc_id: lora
    notes: "seeded, verify against the PDF before trusting the score"
    sections:
      - "1 Introduction"
      - "2 Problem Statement"
      - "3 Aren't Existing Solutions Good Enough?"
      - "4 Our Method"
      - "5 Empirical Experiments"
      - "6 Related Works"
      - "7 Understanding the Low-Rank Updates"
      - "8 Conclusion and Future Work"
